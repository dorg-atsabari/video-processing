[project]
name = "video-processing"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "av",
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "*_test.py"
python_functions = "test_*"
